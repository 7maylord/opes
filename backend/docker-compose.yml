services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opes
      POSTGRES_USER: opes
      POSTGRES_PASSWORD: opes
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opes -d opes"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opes_minio
      MINIO_ROOT_PASSWORD: opes_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >-
      -c "mc alias set local http://minio:9000 opes_minio opes_minio_password &&
      mc mb --ignore-existing local/opes-local"

volumes:
  postgres-data:
  redis-data:
  minio-data:
